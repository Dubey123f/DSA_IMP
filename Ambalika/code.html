<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Editor</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f5f5f5;
    }

    .editor-container {
        width: 80%;
        max-width: 800px;
        display: flex;
        flex-direction: column;
    }

    .code-editor {
        width: 100%;
        height: 200px;
        border: 1px solid #ccc;
        resize: vertical;
        padding: 10px;
        box-sizing: border-box;
        font-family: monospace;
    }

    .output {
        width: 100%;
        margin-top: 10px;
        border: 1px solid #ccc;
        padding: 10px;
        box-sizing: border-box;
        background-color: #fff;
    }
</style>
</head>
<body>
<div class="editor-container">
    <textarea class="code-editor" id="code" placeholder="Type your code here..."></textarea>
    <select id="language">
        <option value="javascript">JavaScript</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="c">C</option>
    </select>
    <button onclick="runCode()">Run</button>
    <div class="output" id="output">Output will be displayed here.</div>
</div>

<script>
    function runCode() {
        var code = document.getElementById("code").value;
        var language = document.getElementById("language").value;
        var outputDiv = document.getElementById("output");

        try {
            switch (language) {
                case "javascript":
                    outputDiv.innerHTML = eval(code);
                    break;
                case "html":
                    outputDiv.innerHTML = code;
                    break;
                case "css":
                    document.getElementById("styleTag").innerHTML = code;
                    break;
                case "c":
                    // Not supported in browser environment
                    outputDiv.innerHTML = "C language execution not supported in browser.";
                    break;
                default:
                    outputDiv.innerHTML = "Invalid language selected.";
            }
        } catch (error) {
            outputDiv.innerHTML = "Error: " + error.message;
        }
    }
</script>
</body>
</html>
